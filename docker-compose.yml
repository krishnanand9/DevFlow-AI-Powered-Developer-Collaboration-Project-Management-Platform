services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  server:
    build: ./server
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/devflow
    ports: ["4000:4000"]
    depends_on: [mongo, redis, ai-engine]
  ai-engine:
    build: ./ai-engine
    env_file: .env
    ports: ["8000:8000"]
  client:
    build: ./client
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  mongo-data:
